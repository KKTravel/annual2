<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>年刊</title>

  <style>
    :root{
      --bg:transparent;
      --pad:14px;
      --ratio: 0.7071;  /* 寬/高：會用 P00 自動更新 */

      --r: 14px;
      --shadow: 0 18px 55px rgba(0,0,0,.18);

      --stackX: 0px;
      --stackY: 0px;
      --stackScale: 1;
    }

    *{ box-sizing:border-box; }
    html, body{
      height:100%;
      margin:0;
      overflow:hidden;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Noto Sans TC", "Segoe UI", Arial, sans-serif;
    }

    #loading{
      position: fixed;
      inset: 0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: var(--bg);
      z-index: 99999;
      color:#333;
      padding: 18px;
      text-align:center;
      white-space: pre-line;
    }

    #app{
      height:100svh;
      width:100vw;
      position:relative;
    }

    /* 工具列 */
    #toolbar{
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      right: calc(12px + env(safe-area-inset-right));
      z-index: 9999;
      display:flex;
      gap:8px;
      align-items:center;
    }
    #toolbar button, #toolbar a{
      appearance:none;
      border:1px solid rgba(0,0,0,.15);
      background: rgba(255,255,255,.92);
      color:#111;
      padding:8px 10px;
      border-radius:10px;
      font-size:14px;
      cursor:pointer;
      text-decoration:none;
      line-height:1;
      user-select:none;
    }
    #btnExit{ display:none; }

    /* 頁碼 */
    #pager{
      position: fixed;
      left: calc(12px + env(safe-area-inset-left));
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 9999;
      font-size: 13px;
      color: rgba(0,0,0,.65);
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(0,0,0,.10);
      padding: 6px 10px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      user-select: none;
    }

    /* 舞台 */
    #stage{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      padding: var(--pad);
      touch-action: none; /* 防止拖曳時被瀏覽器手勢搶走 */
    }

    /* 牌堆尺寸：用高度推回寬度 */
    #deck{
      height: calc(100svh - (var(--pad) * 2));
      width: min(
        calc((100svh - (var(--pad) * 2)) * var(--ratio)),
        calc(100vw - (var(--pad) * 2))
      );
      position: relative;
      border-radius: var(--r);
    }

    .card{
      position:absolute;
      inset:0;
      border-radius: var(--r);
      overflow:hidden;
      background: transparent; /* 去白邊 */
      border: 0;
      box-shadow: var(--shadow);
      transform-origin: center;
      will-change: transform, opacity, filter;
    }
    .card img{
      width:100%;
      height:100%;
      object-fit: contain;
      display:block;
      background: transparent; /* 去白邊 */
      pointer-events:none;
    }

    /* under：下一頁保持 100% 大小（避免“下一頁放大一段”） */
    .card.under{
      transform: translate(0,0) scale(1);
      opacity: 1;
      box-shadow: 0 14px 44px rgba(0,0,0,.14);
    }

    /* under2：疊牌 */
    .card.under2{
      transform: translate(var(--stackX), var(--stackY)) scale(var(--stackScale));
      opacity: 0.85;
      box-shadow: 0 10px 32px rgba(0,0,0,.10);
    }

    .card.top{
      cursor: grab;
    }
    .card.top:active{
      cursor: grabbing;
    }

    @media (prefers-reduced-motion: reduce){
      .card{ transition:none !important; }
    }
  </style>
</head>

<body>
  <div id="loading">載入中…</div>

  <div id="app">
    <div id="toolbar">
      <button id="btnHome" type="button">第一頁</button>
      <a id="pdfLink" href="#" target="_blank" rel="noopener noreferrer">PDF</a>
      <button id="btnFull" type="button">全螢幕</button>
      <button id="btnExit" type="button">退出</button>
    </div>

    <div id="pager">1 / 36</div>

    <div id="stage">
      <div id="deck" aria-label="卡牌堆疊換頁"></div>
    </div>
  </div>

  <script>
    // ===== 你只要改這裡 =====
    const PDF_URL = "https://drive.google.com/file/d/1qyQIyknB_kAufkdjcSySj9qNIhB1JbVG/view?usp=sharing";
    const pageCount = 36; // P00~P35
    // ========================

    const DURATION = 260;   // 拖曳放手後動畫時間
    const HOME_STEP_MS = 40; // 方案A：回第一頁速度（越細越快，40~90 建議）

    const pages = Array.from({length: pageCount}, (_, i) => `assets/P${String(i).padStart(2,'0')}.jpg`);

    const loading = document.getElementById('loading');
    const deck = document.getElementById('deck');
    const pager = document.getElementById('pager');

    const pdfLink = document.getElementById('pdfLink');
    const btnHome = document.getElementById('btnHome');
    const btnFull = document.getElementById('btnFull');
    const btnExit = document.getElementById('btnExit');
    const app = document.getElementById('app');

    pdfLink.href = PDF_URL;

    let idx = 0;
    let animating = false;
    let dragging = false;
    let homeTimer = null;

    const elUnder2 = makeCard('under2');
    const elUnder  = makeCard('under');
    const elTop    = makeCard('top');
    deck.appendChild(elUnder2);
    deck.appendChild(elUnder);
    deck.appendChild(elTop);

    function makeCard(cls){
      const div = document.createElement('div');
      div.className = `card ${cls}`;
      const img = document.createElement('img');
      img.alt = '';
      img.decoding = 'async';
      div.appendChild(img);
      return div;
    }
    function setSrc(el, src){ el.querySelector('img').src = src; }
    function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }
    function setPager(){ pager.textContent = `${idx+1} / ${pageCount}`; }

    function preload(i){
      if (i<0 || i>=pageCount) return;
      const im = new Image();
      im.src = pages[i];
    }

    async function setRatioFromFirst(){
      // 讀唔到都唔會卡死（2秒超時）
      await Promise.race([
        new Promise((resolve)=>{
          const im = new Image();
          im.onload = ()=> {
            if (im.naturalWidth && im.naturalHeight){
              document.documentElement.style.setProperty('--ratio', (im.naturalWidth/im.naturalHeight).toString());
            }
            resolve();
          };
          im.onerror = ()=> resolve();
          im.src = pages[0];
        }),
        new Promise(resolve => setTimeout(resolve, 2000))
      ]);
    }

    function renderStatic(){
      setSrc(elTop, pages[idx]);
      setSrc(elUnder, pages[Math.min(idx+1, pageCount-1)]);
      setSrc(elUnder2, pages[Math.min(idx+2, pageCount-1)]);

      elTop.style.transition = 'none';
      elTop.style.transform = 'translate(0px,0px) rotate(0deg)';
      elTop.style.opacity = '1';
      elTop.style.filter = 'none';

      elUnder.style.transition = 'none';
      elUnder2.style.transition = 'none';

      setPager();
      preload(idx+1); preload(idx+2); preload(idx-1); preload(idx-2);
    }

    // Next：當前頁划走
    function finishNextFromCurrent(){
      if (animating || idx >= pageCount-1) return;
      animating = true;

      const w = deck.clientWidth || 1;
      elTop.style.transition = `transform ${DURATION}ms ease, opacity ${DURATION}ms ease`;
      elTop.style.transform  = `translate(${-w*1.15}px, -10px) rotate(-10deg)`;
      elTop.style.opacity = '0';

      setTimeout(()=>{
        idx++;
        renderStatic();
        animating = false;
      }, DURATION + 20);
    }

    // Prev：上一頁返回來接住
    function finishPrevToCenter(){
      if (animating || idx <= 0) return;
      animating = true;

      elTop.style.transition = `transform ${DURATION}ms ease`;
      elTop.style.transform  = 'translate(0px,0px) rotate(0deg)';

      setTimeout(()=>{
        idx--;
        renderStatic();
        animating = false;
      }, DURATION + 20);
    }

    function bounceBackNext(){
      elTop.style.transition = `transform 200ms ease`;
      elTop.style.transform  = 'translate(0px,0px) rotate(0deg)';
    }

    function bounceBackPrev(){
      const w = deck.clientWidth || 1;
      elTop.style.transition = `transform 200ms ease`;
      elTop.style.transform  = `translate(${-w*1.15}px, -10px) rotate(-10deg)`;
      setTimeout(()=> renderStatic(), 210);
    }

    // 拖曳
    let startX = 0, startY = 0;
    let mode = null; // 'next' | 'prev'
    let lastDx = 0;

    function setMode(newMode){
      if (mode === newMode) return;
      mode = newMode;

      const w = deck.clientWidth || 1;

      if (mode === 'next'){
        setSrc(elTop, pages[idx]);
        setSrc(elUnder, pages[Math.min(idx+1, pageCount-1)]);
        setSrc(elUnder2, pages[Math.min(idx+2, pageCount-1)]);
        elTop.style.opacity = '1';
        elTop.style.filter = 'none';
        elTop.style.transform = 'translate(0px,0px) rotate(0deg)';
      } else if (mode === 'prev'){
        setSrc(elUnder, pages[idx]);
        setSrc(elUnder2, pages[Math.min(idx+1, pageCount-1)]);
        setSrc(elTop, pages[Math.max(idx-1, 0)]);
        elTop.style.opacity = '1';
        elTop.style.filter = 'none';
        elTop.style.transform = `translate(${-w*1.15}px, -10px) rotate(-10deg)`;
      }
    }

    function applyDrag(dx){
      const w = deck.clientWidth || 1;
      const p = clamp(dx / w, -1, 1);

      if (mode === 'next'){
        const rot = p * 8;
        const lift = Math.abs(p) * -6;
        elTop.style.transform = `translate(${dx}px, ${lift}px) rotate(${rot}deg)`;
      } else if (mode === 'prev'){
        const offLeft = -w * 1.15;
        const x = clamp(offLeft + dx, offLeft, 0);
        const t = 1 - Math.abs(x / offLeft);
        const rot = (-10) * (1 - t);
        elTop.style.transform = `translate(${x}px, -10px) rotate(${rot}deg)`;
      }
    }

    // 左右側點擊：左1/3 prev，右1/3 next
    function sideTap(clientX){
      const rect = deck.getBoundingClientRect();
      const x = clientX - rect.left;
      const w = rect.width;

      if (x < w * 0.33){
        if (idx <= 0 || animating || dragging) return;
        setMode('prev');
        requestAnimationFrame(()=> finishPrevToCenter());
      } else if (x > w * 0.67){
        if (idx >= pageCount-1 || animating || dragging) return;
        setMode('next');
        requestAnimationFrame(()=> finishNextFromCurrent());
      }
    }

    elTop.addEventListener('pointerdown', (e)=>{
      if (animating) return;
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      lastDx = 0;
      mode = null;

      elTop.setPointerCapture(e.pointerId);
      elTop.style.transition = 'none';
      elUnder.style.transition = 'none';
      elUnder2.style.transition = 'none';
    });

    elTop.addEventListener('pointermove', (e)=>{
      if (!dragging || animating) return;
      const dx = e.clientX - startX;
      lastDx = dx;

      if (dx > 0 && idx <= 0){
        setMode('next');
        applyDrag(dx * 0.25);
        return;
      }
      if (dx < 0 && idx >= pageCount-1){
        setMode('next');
        applyDrag(dx * 0.25);
        return;
      }

      if (dx < 0) setMode('next');
      else if (dx > 0) setMode('prev');
      if (!mode) return;

      applyDrag(dx);
    });

    elTop.addEventListener('pointerup', (e)=>{
      if (!dragging || animating) return;
      dragging = false;

      const dx = lastDx;
      const dy = e.clientY - startY;

      if (Math.abs(dx) < 10 && Math.abs(dy) < 10){
        sideTap(e.clientX);
        mode = null;
        return;
      }

      const w = deck.clientWidth || 1;
      const threshold = Math.min(180, w * 0.22);

      if (mode === 'next'){
        if (dx <= -threshold) finishNextFromCurrent();
        else bounceBackNext();
      } else if (mode === 'prev'){
        if (dx >= threshold) finishPrevToCenter();
        else bounceBackPrev();
      }

      mode = null;
    });

    elTop.addEventListener('pointercancel', ()=>{
      dragging = false;
      if (!animating) renderStatic();
      mode = null;
    });

    // ===== 方案A：超快逐頁回第一頁（最穩）=====
    function rewindHomeFast(){
      if (animating || dragging || idx === 0) return;

      animating = true;
      deck.style.pointerEvents = "none";

      // 如果已經有 timer，先清掉
      if (homeTimer) {
        clearInterval(homeTimer);
        homeTimer = null;
      }

      homeTimer = setInterval(() => {
        if (idx <= 0) {
          clearInterval(homeTimer);
          homeTimer = null;

          idx = 0;
          renderStatic();
          deck.style.pointerEvents = "";
          animating = false;
          return;
        }

        idx--;
        renderStatic();
      }, HOME_STEP_MS);
    }

    btnHome.addEventListener('click', rewindHomeFast);

    // 全螢幕
    function syncFS(){
      const on = !!document.fullscreenElement;
      btnFull.style.display = on ? 'none' : 'inline-block';
      btnExit.style.display = on ? 'inline-block' : 'none';
    }
    btnFull.addEventListener('click', async ()=>{
      try{ await app.requestFullscreen(); }
      catch(e){ alert("全螢幕被阻擋（若在 iframe 內需 allowfullscreen / allow='fullscreen'）。"); }
    });
    btnExit.addEventListener('click', async ()=>{
      try{ if (document.fullscreenElement) await document.exitFullscreen(); }catch(e){}
    });
    document.addEventListener('fullscreenchange', syncFS);

    // 防止任何 error 導致永遠卡 loading
    window.addEventListener("error", (e) => {
      loading.style.display = "flex";
      loading.textContent = "載入失敗：\n" + (e.message || "unknown error");
    });

    (async function boot(){
      try{
        await setRatioFromFirst();
        renderStatic();
      } finally {
        loading.style.display = 'none';
        syncFS();
      }
    })();
  </script>
</body>
</html>
